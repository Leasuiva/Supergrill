{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supergrill - Ingreso</title>
    
    <link rel="icon" href="{% static 'gestion/logo.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'gestion/css/login_style.css' %}">
</head>
<body>
    <div class="login-box">
        <h2>🍔 Supergrill</h2>
        <p style="color: #888; margin-bottom: 25px;">Iniciar sesión</p>

        {% if error %}
            <div class="error-msj">⚠️ {{ error }}</div>
        {% endif %}

        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-ingresar">Ingresar</button>
        </form>
    </div>

    <script src="{% static 'gestion/js/api.js' %}"></script>
    <script src="{% static 'gestion/js/main.js' %}"></script>

</body>
</html>
